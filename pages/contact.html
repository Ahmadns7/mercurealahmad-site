<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://mercurealahmad.qzz.io/pages/contact.html" />
  <title>Contact — MercuReal Tech Solutions</title>
  <meta name="description" content="Contact MercuReal Tech Solutions. Email sadiqahmadnasir7@gmail.com or WhatsApp +2347083947529. Let's build premium digital systems together." />
  <meta name="keywords" content="contact, email, WhatsApp, MercuReal, tech solutions, start a project" />
  <meta property="og:title" content="Contact — MercuReal" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root { --bg-deep:#060a12; --bg-card:rgba(255,255,255,0.035); --bg-card-border:rgba(255,255,255,0.08); --text-main:#f2efe9; --text-muted:rgba(242,239,233,0.52); --accent:#e0b060; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg-deep);color:var(--text-main);line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    .page{max-width:640px;margin:0 auto;padding:3.5rem 1.5rem 6rem;position:relative}
    a{color:var(--accent);text-decoration:none}
    .back{display:inline-block;margin-bottom:1.5rem;font-size:0.85rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);border-bottom:1px solid var(--bg-card-border);padding-bottom:0.25rem}
    .back:hover{color:var(--text-main)}
    h1{font-family:'Outfit',sans-serif;font-weight:900;font-size:clamp(2.2rem,8vw,4rem);letter-spacing:-0.04em;margin-bottom:0.5rem;line-height:1.05}
    .subtitle{color:var(--text-muted);font-size:1.05rem;max-width:500px;margin-bottom:2.5rem}
    form{display:flex;flex-direction:column;gap:1rem}
    label{font-size:0.8rem;font-weight:500;color:var(--text-muted);letter-spacing:0.05em;text-transform:uppercase}
    input,textarea{width:100%;padding:1rem 1.1rem;border-radius:12px;background:var(--bg-card);border:1px solid var(--bg-card-border);color:var(--text-main);font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;transition:border-color 0.25s,background 0.25s}
    input:focus,textarea:focus{border-color:rgba(224,176,96,0.5);background:rgba(255,255,255,0.06)}
    button{padding:1rem 2rem;border-radius:9999px;background:linear-gradient(135deg,var(--accent),#c49a40);color:#0b0d14;font-family:'Outfit',sans-serif;font-weight:700;font-size:1rem;border:none;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;box-shadow:0 8px 28px rgba(224,176,96,0.35)}
    button:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(224,176,96,0.45)}

    /* Cartoon in page */
    .cartoon-wrap{position:fixed;bottom:1.2rem;right:1.2rem;z-index:20;width:100px;height:100px;pointer-events:none}
    .cartoon-body{width:70px;height:90px;background:var(--accent);border-radius:50% 50% 45% 45%;margin:0 auto;position:relative;box-shadow:0 8px 20px rgba(224,176,96,0.35);animation:bob 3s ease-in-out infinite}
    .cartoon-body::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:28px;height:28px;background:var(--accent-deep);border-radius:50%}
    .cartoon-eyes{position:absolute;top:28px;left:50%;transform:translateX(-50%);display:flex;gap:12px}
    .cartoon-eye{width:14px;height:14px;background:#060a12;border-radius:50%;position:relative}
    .cartoon-eye::after{content:'';position:absolute;top:3px;left:3px;width:3px;height:3px;background:var(--accent);border-radius:50%}
    .cartoon-hands{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:90px;height:45px;pointer-events:none;transition:all 0.5s ease}
    .cartoon-hand{position:absolute;width:26px;height:32px;background:#f2efe9;border-radius:10px;top:0;transition:all 0.5s ease}
    .cartoon-hand.left{left:6px;transform:rotate(-15deg)}
    .cartoon-hand.right{right:6px;transform:rotate(15deg)}
    .cartoon-wrap.typing-active .cartoon-hand{top:-35px}
    .cartoon-wrap.typing-active .cartoon-hand.left{transform:rotate(-25deg) translateY(-25px)}
    .cartoon-wrap.typing-active .cartoon-hand.right{transform:rotate(25deg) translateY(-25px)}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .contact-cards{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:2rem}
    .contact-card{padding:1.25rem;border-radius:16px;background:var(--bg-card);border:1px solid var(--bg-card-border);text-decoration:none;color:inherit;transition:all 0.25s}
    .contact-card:hover{border-color:rgba(224,176,96,0.35);transform:translateY(-3px)}
    .contact-card h4{font-family:'Outfit',sans-serif;font-weight:700;font-size:1rem;margin-bottom:0.25rem}
    .contact-card p{font-size:0.85rem;color:var(--text-muted);margin-bottom:0}
  </style>
</head>
<body>
<nav style="position:sticky;top:1rem;z-index:50;margin:0 auto;max-width:720px;padding:.35rem .4rem;background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.08);border-radius:9999px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:center;gap:.25rem;font-family:'DM Sans',sans-serif;font-size:.82rem">
  <a href="https://mercurealahmad.qzz.io/" style="font-family:'Outfit',sans-serif;font-weight:800;font-size:1.05rem;color:#f2efe9;letter-spacing:-.03em;text-decoration:none;padding-left:.2rem">MercuReal <span style="color:#e0b060">Tech</span></a>
  <a href="https://mercurealahmad.qzz.io/pages/capabilities.html" style="color:rgba(243,240,235,0.55);text-decoration:none;padding:.35rem .6rem;border-radius:9999px;transition:background .2s">Capabilities</a>
  <a href="https://mercurealahmad.qzz.io/pages/portfolio.html" style="color:rgba(243,240,235,0.55);text-decoration:none;padding:.35rem .6rem;border-radius:9999px;transition:background .2s">Portfolio</a>
  <a href="https://mercurealahmad.qzz.io/pages/contact.html" style="color:rgba(243,240,235,0.55);text-decoration:none;padding:.35rem .6rem;border-radius:9999px;transition:background .2s">Contact</a>
</nav>
  <main class="page" id="contact">
    <a href="../index.html" class="back">← Back to home</a>
    <h1>Contact</h1>
    <p class="subtitle">Let's build premium digital systems for your business. Reach out directly via email or WhatsApp.</p>

    <form id="contactForm" onsubmit="event.preventDefault(); this.innerHTML='<p style=\'color:var(--accent);font-family:Outfit;font-weight:700;\'>Message sent! We will respond shortly.</p>'; document.getElementById('cartoonWrap').classList.remove('typing-active');">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required />
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" placeholder="Tell us about your project..." required></textarea>
      <button type="submit">Send message</button>
    </form>

    <div class="contact-cards">
      <a href="mailto:sadiqahmadnasir7@gmail.com" class="contact-card" aria-label="Email contact">
        <h4>Email</h4>
        <p>sadiqahmadnasir7@gmail.com</p>
      </a>
      <a href="https://wa.me/2347083947529" target="_blank" rel="noopener noreferrer" class="contact-card" aria-label="WhatsApp contact">
        <h4>WhatsApp</h4>
        <p>+2347083947529</p>
      </a>
    </div>

    <aside class="cartoon-wrap" id="cartoonWrap" aria-label="Cartoon covering eyes when typing">
      <div class="cartoon">
        <div class="cartoon-body"></div>
        <div class="cartoon-eyes"><div class="cartoon-eye"></div><div class="cartoon-eye"></div></div>
        <div class="cartoon-hands"><div class="cartoon-hand left"></div><div class="cartoon-hand right"></div></div>
      </div>
    </aside>
  </main>

  <script>
    const wrap = document.getElementById('cartoonWrap');
    document.getElementById('contactForm').addEventListener('focusin', () => wrap.classList.add('typing-active'));
    document.getElementById('contactForm').addEventListener('focusout', () => wrap.classList.remove('typing-active'));
  </script>
</body>
</html>
